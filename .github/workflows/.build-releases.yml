name: Build and Release DEB Packages

on:
  release:
    types: [published]

jobs:
  build-debs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Debian Package
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          PKG_DIR="uraam-debian_${VERSION}_all"
          mkdir -p "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/uraam/GUI" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/icons/hicolor/scalable/apps" "$PKG_DIR/DEBIAN"
          cp uraam.sh "$PKG_DIR/usr/share/uraam/"
          cp -r Configs "$PKG_DIR/usr/share/uraam/"
          cp uraam-api.sh "$PKG_DIR/usr/share/uraam/"
          cp GUI/main.py "$PKG_DIR/usr/share/uraam/GUI/"
          cp uraam-gui "$PKG_DIR/usr/bin/uraam-gui"
          cp assets/uraam_logo.svg "$PKG_DIR/usr/share/icons/hicolor/scalable/apps/uraam.svg"
          cp packaging/debian/uraam.desktop "$PKG_DIR/usr/share/uraam/uraam.desktop"
          chmod 0755 "$PKG_DIR/usr/share/uraam/uraam.sh" "$PKG_DIR/usr/share/uraam/uraam-api.sh" "$PKG_DIR/usr/bin/uraam-gui"
          sed "s/VERSION_PLACEHOLDER/$VERSION/" packaging/debian/DEBIAN/control > "$PKG_DIR/DEBIAN/control"
          cp packaging/debian/DEBIAN/postinst "$PKG_DIR/DEBIAN/"
          cp packaging/debian/DEBIAN/postrm "$PKG_DIR/DEBIAN/"
          chmod 755 "$PKG_DIR/DEBIAN/postinst" "$PKG_DIR/DEBIAN/postrm"
          dpkg-deb --build "$PKG_DIR"

      - name: Build Termux Package
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          PKG_DIR="uraam-termux_${VERSION}_all"
          PREFIX="data/data/com.termux/files/usr"
          mkdir -p "$PKG_DIR/$PREFIX/bin" "$PKG_DIR/$PREFIX/share/uraam" "$PKG_DIR/DEBIAN"
          cp uraam.sh "$PKG_DIR/$PREFIX/share/uraam/"
          cp -r Configs "$PKG_DIR/$PREFIX/share/uraam/"
          chmod +x "$PKG_DIR/$PREFIX/share/uraam/uraam.sh"
          sed "s/VERSION_PLACEHOLDER/$VERSION/" packaging/termux/DEBIAN/control > "$PKG_DIR/DEBIAN/control"
          cp packaging/termux/DEBIAN/postinst "$PKG_DIR/DEBIAN/"
          cp packaging/termux/DEBIAN/postrm "$PKG_DIR/DEBIAN/"
          chmod 755 "$PKG_DIR/DEBIAN/postinst" "$PKG_DIR/DEBIAN/postrm"
          dpkg-deb --build "$PKG_DIR"

      - name: Upload DEB Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uraam-debian_*.deb
            uraam-termux_*.deb
