name: Validate debloat configurations

on:
  pull_request:
    paths:
      - "Configs/debloat/**/*.json"
      - "Configs/debloat/*.json"
      - "scripts/validate-debloat-json.py"
      - ".github/workflows/validate-debloat-configs.yml"
  push:
    branches:
      - main
    paths:
      - "Configs/debloat/**/*.json"
      - "Configs/debloat/*.json"
      - "scripts/validate-debloat-json.py"
      - ".github/workflows/validate-debloat-configs.yml"

permissions:
  contents: read

jobs:
  validate:
    name: JSON schema and Safe package audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate changed JSON profiles and UAD classifications
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_json="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- Configs/debloat | grep -E '\\.json$' || true)"
          if [ -z "$changed_json" ]; then
            echo "No changed debloat JSON profiles."
            exit 0
          fi
          mapfile -t files <<< "$changed_json"
          python3 scripts/validate-debloat-json.py "${files[@]}"
