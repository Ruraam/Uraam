name: URAAM GUI foundation CI

on:
  pull_request:
    paths:
      - "uraam-api.sh"
      - "uraam-gui"
      - "installer.sh"
      - "packaging/debian/**"
      - "assets/uraam_logo.svg"
      - ".github/workflows/.build-releases.yml"
      - "GUI/**"
      - "tests/test-json-api.sh"
      - "tests/test-api-protocol.py"
      - "tests/test-api-output-limits.sh"
      - "tests/test-bridge-process.py"
      - "tests/test-bridge-process.py"
      - ".github/workflows/gui-foundation.yml"
  push:
    branches:
      - "feat/**"
    paths:
      - "uraam-api.sh"
      - "uraam-gui"
      - "GUI/**"
      - "tests/test-json-api.sh"
      - "tests/test-api-protocol.py"
      - "tests/test-api-output-limits.sh"
      - "tests/test-bridge-process.py"
      - ".github/workflows/gui-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-foundation:
    name: Validate read-only bridge and GTK4 frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck python3-gi gir1.2-gtk-4.0

      - name: Validate Bash syntax
        run: |
          bash -n uraam.sh
          bash -n uraam-api.sh
          bash -n uraam-gui
          bash -n installer.sh
          bash -n tests/test-json-api.sh
          bash -n tests/test-api-output-limits.sh

      - name: Run ShellCheck
        run: shellcheck --severity=error uraam.sh uraam-api.sh uraam-gui installer.sh tests/test-json-api.sh tests/test-api-output-limits.sh

      - name: Validate Python syntax and GTK4 bindings
        run: |
          python3 -m py_compile GUI/main.py GUI/api_protocol.py GUI/bridge_process.py tests/test-api-protocol.py tests/test-bridge-process.py
          python3 tests/test-api-protocol.py
          python3 tests/test-bridge-process.py
          python3 -c "import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk; print(Gtk.get_major_version(), Gtk.get_minor_version())"

      - name: Validate Debian desktop package layout
        run: |
          VERSION="0.0.0"
          PKG_DIR="uraam-debian_${VERSION}_all"
          mkdir -p "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/uraam/GUI" "$PKG_DIR/usr/share/icons/hicolor/scalable/apps" "$PKG_DIR/DEBIAN"
          cp uraam.sh "$PKG_DIR/usr/share/uraam/"
          cp -r Configs "$PKG_DIR/usr/share/uraam/"
          cp uraam-api.sh "$PKG_DIR/usr/share/uraam/"
          cp GUI/main.py GUI/api_protocol.py GUI/bridge_process.py "$PKG_DIR/usr/share/uraam/GUI/"
          cp uraam-gui "$PKG_DIR/usr/bin/uraam-gui"
          cp assets/uraam_logo.svg "$PKG_DIR/usr/share/icons/hicolor/scalable/apps/uraam.svg"
          cp packaging/debian/uraam.desktop "$PKG_DIR/usr/share/uraam/uraam.desktop"
          sed "s/VERSION_PLACEHOLDER/$VERSION/" packaging/debian/DEBIAN/control > "$PKG_DIR/DEBIAN/control"
          cp packaging/debian/DEBIAN/postinst packaging/debian/DEBIAN/postrm "$PKG_DIR/DEBIAN/"
          chmod 0755 "$PKG_DIR/usr/share/uraam/uraam.sh" "$PKG_DIR/usr/share/uraam/uraam-api.sh" "$PKG_DIR/usr/bin/uraam-gui"
          chmod 0755 "$PKG_DIR/DEBIAN/postinst" "$PKG_DIR/DEBIAN/postrm"
          dpkg-deb --build "$PKG_DIR"
          dpkg-deb --contents "${PKG_DIR}.deb" | grep -q '/usr/bin/uraam-gui'
          dpkg-deb --contents "${PKG_DIR}.deb" | grep -q '/usr/share/uraam/GUI/main.py'
          dpkg-deb --contents "${PKG_DIR}.deb" | grep -q '/usr/share/icons/hicolor/scalable/apps/uraam.svg'
      - name: Test read-only JSON API
        run: bash tests/test-json-api.sh

      - name: Test API output size limits
        run: bash tests/test-api-output-limits.sh
